# Rail Watch sources.
#
# Every number the model uses comes from one of these entries.
#   status: live       fetched from a keyless public API on every snapshot
#   status: modeled    taken from a published fee schedule, or an explicit assumption where none is published
#   status: statutory  set by Indian law
#
# Modeled and statutory entries must carry `value` and `as_of` (the date the figure was taken from, or last
# checked against, the publisher). Entries that feed the model also carry `param`, the ModeledParams field
# they set (src/model/types.ts). The loader (scripts/sources.ts) refuses to run if any of that is missing.
# Edit a value here, then `npm run recompute` (offline, reuses the stored live inputs) or `npm run fetch`.
# Nothing else needs to change: the site and the route labels read every rate from here.

sources:
  # ---------------------------------------------------------------- live
  - id: mid-market
    label: Mid-market USD/INR (median of four keyless feeds)
    status: live
    publisher: Wise, Coinbase, ExchangeRate-API, Frankfurter (ECB)
    url: https://api.frankfurter.dev/v1/latest?base=USD&symbols=INR
    note: >-
      Median of Wise's mid-market rate, Coinbase's exchange-rates endpoint, open.er-api.com and the
      ECB reference rate via Frankfurter. ECB and ExchangeRate-API update once per working day, so on
      weekends the median leans on the two live feeds. Every route is measured against this one number.

  - id: wise-comparisons
    label: Wise public comparison feed (USD to INR)
    status: live
    publisher: Wise
    url: https://api.wise.com/v4/comparisons/?sourceCurrency=USD&targetCurrency=INR&sendAmount=1000
    note: >-
      Keyless endpoint that powers wise.com/compare. Each provider quote carries its own collection
      timestamp, which can be up to a few days old for banks. Wise runs this feed and is itself a
      competitor in it, so we recompute every markup against our own mid-market median instead of
      using Wise's markup figure.

  - id: coindcx-orderbook
    label: CoinDCX public order books (USDC/INR, USDT/INR, USDC/USDT)
    status: live
    publisher: CoinDCX
    url: https://public.coindcx.com/market_data/orderbook?pair=I-USDC_INR
    note: >-
      Keyless order book endpoint. We market-sell the full amount into the bid side, level by level,
      so larger transfers pay for thin books. Top 50 bid levels are stored in each snapshot.

  - id: base-rpc
    label: Base gas price and L1 data fee
    status: live
    publisher: Base public RPC (mainnet.base.org)
    url: https://mainnet.base.org
    note: >-
      eth_gasPrice times 65,000 gas for a USDC transfer, plus the L1 data fee upper bound from the
      GasPriceOracle predeploy (0x4200...000F) for a 300 byte transaction.

  - id: solana-rpc
    label: Solana base fee and recent priority fees
    status: live
    publisher: Solana public RPC (api.mainnet-beta.solana.com)
    url: https://api.mainnet-beta.solana.com
    note: >-
      5,000 lamport base fee plus the 75th percentile of getRecentPrioritizationFees for the USDC mint,
      over a 30,000 compute unit budget.

  - id: coinbase-spot
    label: ETH and SOL spot prices in USD
    status: live
    publisher: Coinbase
    url: https://api.coinbase.com/v2/prices/ETH-USD/spot
    note: Used only to convert network fees into dollars.

  # ---------------------------------------------------------------- modeled: banks
  - id: chase-usd-wire-fee
    label: Chase outgoing international wire, sent in USD, online
    status: modeled
    param: chaseUsdWireFeeUsd
    value: 40
    unit: USD
    as_of: "2026-10-04"
    publisher: JPMorgan Chase, Additional Banking Services and Fees (personal), corroborated by Monito
    url: https://www.monito.com/en/wiki/international-wire-transfers-chase-bank-us
    note: >-
      Chase charges $40 for a USD-denominated international wire sent online ($50 with a banker) and
      $5 (or $0 at $5,000 and above) when sent in foreign currency. The foreign-currency fee is
      confirmed live by the Wise feed ($5 at $1,000, $0 at $5,000). Chase's personal fee page moved
      and its old URL returns 404, so the $40 figure is cited from independent 2026 fee guides and
      dated the day it was last checked. Re-check against Chase's Deposit Account Agreement.

  - id: correspondent-fee
    label: Correspondent (intermediary) bank deduction on a USD SWIFT wire
    status: modeled
    param: correspondentFeeUsd
    value: 20
    unit: USD
    as_of: "2026-10-04"
    publisher: Assumption
    url: https://www.swift.com/our-solutions/swift-gpi
    note: >-
      Banks disclose that intermediaries "may deduct" fees but do not publish amounts. $20 is a
      mid-range assumption for one intermediary on a SHA wire. This is the least certain number in
      the model, and it only affects the "SWIFT in USD" route.

  # ---------------------------------------------------------------- modeled: stablecoin on-ramp
  - id: coinbase-ach
    label: Coinbase ACH deposit fee
    status: modeled
    param: coinbaseAchDepositUsd
    value: 0
    unit: USD
    as_of: "2026-10-04"
    publisher: Coinbase Help Center
    url: https://help.coinbase.com/en/coinbase/trading-and-funding/pricing-and-fees/fees
    note: >-
      Standard ACH deposits into a US Coinbase account are free (last checked 2026-10-04). Wire
      deposits cost $10. ACH takes several business days to clear before the USDC can be sent.

  - id: coinbase-usdc
    label: Coinbase USD to USDC conversion fee
    status: modeled
    param: coinbaseUsdcConversionFeeRate
    value: 0
    unit: fraction
    as_of: "2026-10-04"
    publisher: Coinbase Help Center
    url: https://help.coinbase.com/en/coinbase/getting-started/crypto-education/usd-coin-usdc-faq
    note: >-
      Coinbase converts USD to USDC 1:1 with no fee or spread (last checked 2026-10-04). Coinbase
      Exchange charges on USDC to USD conversions above $2 million per 30 days, irrelevant here.

  # ---------------------------------------------------------------- modeled: Indian exchange
  - id: coindcx-deposit
    label: Crypto deposit fee on CoinDCX
    status: modeled
    publisher: CoinDCX
    url: https://coindcx.com/fees
    param: exchangeDepositFeeUsd
    value: 0
    unit: USD
    as_of: "2026-10-04"
    note: >-
      Deposits are free. Check that the exchange accepts USDC on the network you send on before
      sending: support varies by token and network.

  - id: coindcx-trading-fee
    label: CoinDCX INR market taker fee
    status: modeled
    param: exchangeTakerFeeRate
    value: 0.005
    unit: fraction
    as_of: "2026-10-04"
    publisher: Assumption based on CoinDCX's published fee page
    url: https://coindcx.com/fees
    note: >-
      Indian exchanges publish INR-market spot fees in the 0.1% to 0.5% range depending on tier and
      promotions. We use 0.5% (the conservative end). The fee page blocks automated access, so this
      is not fetched live: re-check before publishing.

  - id: coindcx-swap-fee
    label: CoinDCX USDC/USDT market fee
    status: modeled
    param: exchangeSwapFeeRate
    value: 0.001
    unit: fraction
    as_of: "2026-10-04"
    publisher: Assumption based on CoinDCX's published fee page
    url: https://coindcx.com/fees
    note: Only used on the USDC to USDT to INR path. Assumed 0.1%.

  - id: coindcx-inr-withdrawal
    label: INR withdrawal fee to an Indian bank account
    status: modeled
    param: inrWithdrawalFeeInr
    value: 10
    unit: INR
    as_of: "2026-10-04"
    publisher: Assumption
    url: https://coindcx.com/fees
    note: >-
      Assumed ₹10 flat per IMPS withdrawal. Several 2026 fee guides list CoinDCX INR withdrawals as
      free, so this is deliberately conservative. Immaterial at these amounts.

  # ---------------------------------------------------------------- statutory
  - id: gst-currency-conversion
    label: GST on currency conversion, Rule 32(2)(b) of the CGST Rules, 2017
    status: statutory
    param: gstRate
    value: 0.18
    unit: fraction
    as_of: "2017-07-01"
    publisher: CBIC, Government of India
    url: https://cbic-gst.gov.in/gst-acts.html
    note: >-
      When a bank converts foreign currency, GST at 18% applies to a deemed value: 1% of the gross
      amount up to ₹1 lakh (minimum ₹250), ₹1,000 plus 0.5% of the amount above ₹1 lakh up to ₹10
      lakh, ₹5,500 plus 0.1% of the amount above ₹10 lakh (value capped at ₹60,000). This slab method
      is Rule 32(2)(b), an option the bank may elect instead of the spread-based Rule 32(2)(a). Banks
      apply it to inward USD remittances they convert. It does not apply when the money arrives
      already in INR, which is why provider routes skip it.

  - id: gst-on-fees
    label: GST on exchange fees
    status: statutory
    param: gstOnFeesRate
    value: 0.18
    unit: fraction
    as_of: "2017-07-01"
    publisher: CBIC, Government of India
    url: https://cbic-gst.gov.in/gst-acts.html
    note: >-
      Exchange trading fees are a taxable service at the standard 18% (9% CGST + 9% SGST, or 18% IGST).
      Indian exchanges add it on top of the fee.

  - id: tds-194s
    label: 1% TDS on transfer of virtual digital assets
    status: statutory
    param: tdsRate
    value: 0.01
    unit: fraction
    as_of: "2022-07-01"
    publisher: Income Tax Department, Government of India (Section 194S; CBDT Circular 13/2022)
    url: https://www.incometaxindia.gov.in/w/tds-on-payment-for-the-transfer-of-virtual-digital-assets-vdas-
    note: >-
      Introduced by the Finance Act, 2022 as Section 194S of the Income-tax Act, 1961, and carried into
      the Income-tax Act, 2025 under new numbering; we cite the 1961 section because exchanges and CBDT
      guidance still use it. The exchange withholds 1% on every VDA transfer, including crypto to crypto
      swaps. Per CBDT Circular 13/2022 the base is the consideration excluding GST and the exchange's
      own charges, so the model withholds on proceeds net of fee and GST. No TDS is due if the year's
      total is under ₹10,000 (₹50,000 for a "specified person"); the model always withholds. TDS is
      credited against your tax, or refunded, only when you file your return.

  - id: vda-tax-115bbh
    label: 30% tax on income from transfer of virtual digital assets, plus 4% cess
    status: statutory
    param: vdaTaxRate
    value: 0.30
    unit: fraction
    as_of: "2022-04-01"
    publisher: Income Tax Department, Government of India (Section 115BBH, Finance Act 2022)
    url: https://incometaxindia.gov.in/
    note: >-
      Section 115BBH of the Income-tax Act, 1961 (carried into the 2025 Act): gains are taxed at a flat 30%, only the cost of acquisition is deductible (no
      fees), and losses cannot be set off against anything. 4% health and education cess applies on
      top. Surcharge at high incomes is ignored. We assume a cost basis equal to the mid-market INR
      value of the USDC, which is the right model when you are moving your own money or a gift from
      a relative. If the USDC is payment for services, it is taxed as income on receipt instead.

  - id: health-education-cess
    label: Health and education cess on income tax
    status: statutory
    param: vdaCessRate
    value: 0.04
    unit: fraction
    as_of: "2018-04-01"
    publisher: Income Tax Department, Government of India (Finance Act, 2018)
    url: https://incometaxindia.gov.in/
    note: 4% of the tax amount.
