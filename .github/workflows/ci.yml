name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format check
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (model math, sources.yaml validation, committed snapshot reconciliation)
        run: npm test
      - name: Build
        run: npm run build
